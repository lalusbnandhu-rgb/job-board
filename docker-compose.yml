services:
  # ── Frontend — Next.js 15 ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobboard-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - jobboard-net
    restart: unless-stopped

  # ── Backend — Express API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobboard-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_nm:/app/node_modules
    env_file:
      - .env
    environment:
      # Override DB URI to use Docker service name (not localhost)
      - MONGODB_URI=mongodb://mongodb:27017/jobboard
      # Raised limits for local dev & E2E testing (production keeps the low defaults)
      - API_RATE_LIMIT_MAX=1000
      - LOGIN_RATE_LIMIT_MAX=100
      - REGISTER_RATE_LIMIT_MAX=50
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobboard-net
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: jobboard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=jobboard
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobboard-net
    restart: unless-stopped

  # ── Mongo Express — DB GUI (dev only) ─────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: jobboard-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - jobboard-net
    restart: unless-stopped

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  frontend_nm:
  frontend_next:
  backend_nm:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  jobboard-net:
    driver: bridge
